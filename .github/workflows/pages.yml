name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site/assets
          cp index.html styles.css portfolio-preview.js branding-preview.html _site/
          cp assets/hanif-cutout.png assets/finance-asset-management.png assets/smart-maintenance.jpg assets/workshop-orders.png assets/workshop-receipt.png assets/workshop-pos-mobile.jpg _site/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
